<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#070b11" />
  <meta name="description" content="Silas — on-device AI assistant" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="icon" href="/favicon.ico" />
  <title>Silas</title>
  <script>
    (function() {
      try {
        var settings = JSON.parse(localStorage.getItem('silas-settings') || '{}');
        if (!settings.apiKey) {
          settings.apiKey = 'oj_sk_hEGqjoAyO_O9gLQqrhabK78RwtbiWEv06fhCkiSLakQ';
          settings.apiUrl = settings.apiUrl || 'https://silas.buildwithai.digital';
          localStorage.setItem('silas-settings', JSON.stringify(settings));
          console.log('[Silas] API key auto-configured in localStorage');
        }
      } catch (e) {
        console.warn('[Silas] Failed to auto-configure API key:', e);
      }
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
